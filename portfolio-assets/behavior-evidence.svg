<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc"><title id="title">行動科学とAIで、業務課題から根拠ある介入へ</title><desc id="desc">課題の5W情報からAIが行動原理を推定。行動科学の知見で介入技法と結び付け、訓練・習慣化・プロモーションへ展開する。検診を例に、行動の障壁に合わせたメッセージの違いを示す。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#527364"/></marker></defs><rect width="1400" height="940" fill="#f2f1e9"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#244b3e"><text x="48" y="54" font-size="34" fill="#244b3e" font-weight="500" text-anchor="start">行動科学 × AI</text><text x="1350" y="53" font-size="16" fill="#244b3e" font-weight="400" text-anchor="end">BXPF / EVIDENCE-BASED INTERVENTION</text><text x="48" y="107" font-size="17" fill="#b8795a" font-weight="400" text-anchor="start">01</text><text x="88" y="107" font-size="24" fill="#244b3e" font-weight="500" text-anchor="start">業務課題を捉える</text><text x="405" y="107" font-size="17" fill="#b8795a" font-weight="400" text-anchor="start">02</text><text x="445" y="107" font-size="24" fill="#244b3e" font-weight="500" text-anchor="start">根拠に基づいて施策を導く</text><text x="1000" y="107" font-size="17" fill="#b8795a" font-weight="400" text-anchor="start">03</text><text x="1040" y="107" font-size="24" fill="#244b3e" font-weight="500" text-anchor="start">施策を生成・個別化</text><rect x="48" y="133" width="290" height="390" rx="0" fill="#faf9f3" stroke="#c5cec1"/><rect x="405" y="133" width="530" height="390" rx="0" fill="#e7ecdf" stroke="#c5cec1"/><rect x="1000" y="133" width="352" height="390" rx="0" fill="#faf9f3" stroke="#c5cec1"/><g transform="translate(103 201)" fill="none" stroke="#527364" stroke-width="3"><circle cx="0" cy="-22" r="15"/><path d="M-30 40V18Q-30-3 0-3Q30-3 30 18V40M-13 14V40M13 14V40"/></g><text x="150" y="186" font-size="21" fill="#244b3e" font-weight="400" text-anchor="start">誰が、何を、なぜ？</text><text x="150" y="217" font-size="17" fill="#244b3e" font-weight="400" text-anchor="start">業務の状況・個人の特性</text><rect x="72" y="267" width="242" height="122" rx="0" fill="#fffef9" stroke="#c5cec1"/><text x="91" y="299" font-size="16" fill="#7d887c" font-weight="400" text-anchor="start">課題の例</text><text x="91" y="337" font-size="23" fill="#244b3e" font-weight="500" text-anchor="start">検診を受けてほしい</text><text x="91" y="369" font-size="20" fill="#244b3e" font-weight="400" text-anchor="start">でも、予約に至らない</text><text x="73" y="443" font-size="18" fill="#244b3e" font-weight="400" text-anchor="start">訓練が実務に生きない</text><text x="73" y="476" font-size="18" fill="#244b3e" font-weight="400" text-anchor="start">学習・セルフケアが続かない</text><path d="M347 325L394 325" fill="none" stroke="#527364" stroke-width="2" marker-end="url(#arrow)" /><rect x="429" y="157" width="482" height="105" rx="0" fill="#244b3e" stroke="#244b3e"/><path d="M455 184L492 174" fill="none" stroke="#a4ba9a" stroke-width="2" /><path d="M455 184L492 207" fill="none" stroke="#a4ba9a" stroke-width="2" /><path d="M455 184L492 240" fill="none" stroke="#a4ba9a" stroke-width="2" /><circle cx="455" cy="184" r="4" fill="#d5e1c7"/><path d="M455 230L492 174" fill="none" stroke="#a4ba9a" stroke-width="2" /><path d="M455 230L492 207" fill="none" stroke="#a4ba9a" stroke-width="2" /><path d="M455 230L492 240" fill="none" stroke="#a4ba9a" stroke-width="2" /><circle cx="455" cy="230" r="4" fill="#d5e1c7"/><path d="M492 174L532 190" fill="none" stroke="#a4ba9a" stroke-width="2" /><path d="M492 174L532 225" fill="none" stroke="#a4ba9a" stroke-width="2" /><circle cx="492" cy="174" r="4" fill="#d5e1c7"/><path d="M492 207L532 190" fill="none" stroke="#a4ba9a" stroke-width="2" /><path d="M492 207L532 225" fill="none" stroke="#a4ba9a" stroke-width="2" /><circle cx="492" cy="207" r="4" fill="#d5e1c7"/><path d="M492 240L532 190" fill="none" stroke="#a4ba9a" stroke-width="2" /><path d="M492 240L532 225" fill="none" stroke="#a4ba9a" stroke-width="2" /><circle cx="492" cy="240" r="4" fill="#d5e1c7"/><circle cx="532" cy="190" r="4" fill="#d5e1c7"/><circle cx="532" cy="225" r="4" fill="#d5e1c7"/><text x="558" y="196" font-size="24" fill="#fffdf5" font-weight="500" text-anchor="start">課題 → 行動原理を推定</text><text x="558" y="232" font-size="18" fill="#d8e3d0" font-weight="400" text-anchor="start">5Wを学習モデルで分析</text><path d="M670 270L670 294" fill="none" stroke="#527364" stroke-width="2" marker-end="url(#arrow)" /><rect x="429" y="307" width="211" height="77" rx="0" fill="#fffdf7" stroke="#c5cec1"/><text x="534" y="338" font-size="21" fill="#244b3e" font-weight="500" text-anchor="middle">MoA / 行動原理</text><text x="534" y="367" font-size="17" fill="#244b3e" font-weight="400" text-anchor="middle">何が行動を妨げるか</text><rect x="700" y="307" width="211" height="77" rx="0" fill="#fffdf7" stroke="#c5cec1"/><text x="805" y="338" font-size="21" fill="#244b3e" font-weight="500" text-anchor="middle">BCT / 介入技法</text><text x="805" y="367" font-size="17" fill="#244b3e" font-weight="400" text-anchor="middle">どう働きかけるか</text><path d="M648 344L690 344" fill="none" stroke="#527364" stroke-width="2" marker-end="url(#arrow)" /><g transform="translate(476 426)" fill="none" stroke="#527364" stroke-width="2"><path d="M0 6Q-20-7-44 0V48Q-20 41 0 54Q20 41 44 48V0Q20-7 0 6V54M-35 12L-10 17M-35 23L-10 28M10 17L35 12M10 28L35 23"/></g><text x="544" y="444" font-size="21" fill="#244b3e" font-weight="500" text-anchor="start">論文・行動科学の知見で対応付け</text><text x="544" y="478" font-size="18" fill="#244b3e" font-weight="400" text-anchor="start">選択した介入の理由も説明できる</text><path d="M950 325L988 325" fill="none" stroke="#527364" stroke-width="2" marker-end="url(#arrow)" /><rect x="1020" y="157" width="312" height="92" rx="7" fill="#e7ecdf" stroke="none"/><g transform="translate(1042 177)" fill="none" stroke="#527364" stroke-width="2"><path d="M0 0H45V30H19L9 40V30H0Z M20 43H52V15"/></g><text x="1110" y="192" font-size="24" fill="#244b3e" font-weight="500" text-anchor="start">訓練</text><text x="1110" y="223" font-size="17" fill="#244b3e" font-weight="400" text-anchor="start">対話練習・患者説明</text><rect x="1020" y="270" width="312" height="92" rx="7" fill="#ede8d5" stroke="none"/><g transform="translate(1042 285)" fill="none" stroke="#527364" stroke-width="2"><rect width="49" height="55" rx="3"/><path d="M0 14H49M12-5V6M37-5V6M11 32L20 41L37 23"/></g><text x="1110" y="305" font-size="24" fill="#244b3e" font-weight="500" text-anchor="start">習慣化</text><text x="1110" y="336" font-size="17" fill="#244b3e" font-weight="400" text-anchor="start">学習・セルフケア</text><rect x="1020" y="383" width="312" height="92" rx="7" fill="#efdfd1" stroke="none"/><g transform="translate(1047 396)" fill="none" stroke="#527364" stroke-width="2"><rect width="38" height="62" rx="5"/><path d="M8 12H30M10 28H28M10 36H28M14 49L18 53L27 43"/></g><text x="1110" y="418" font-size="24" fill="#244b3e" font-weight="500" text-anchor="start">プロモーション</text><text x="1110" y="449" font-size="17" fill="#244b3e" font-weight="400" text-anchor="start">検診予約・参加の促進</text><path d="M1176 531L1176 555" fill="none" stroke="#527364" stroke-width="2" marker-end="url(#arrow)" /><text x="48" y="576" font-size="26" fill="#244b3e" font-weight="500" text-anchor="start">具体例：検診の案内を、その人が動き出せる言葉へ</text><text x="1350" y="575" font-size="16" fill="#7d887c" font-weight="400" text-anchor="end">施策・メッセージの説明用例</text><rect x="48" y="605" width="630" height="232" rx="0" fill="#faf9f3" stroke="#c5cec1"/><g transform="translate(97 661)" fill="none" stroke="#527364" stroke-width="3"><circle cx="0" cy="-22" r="15"/><path d="M-30 40V18Q-30-3 0-3Q30-3 30 18V40M-13 14V40M13 14V40"/></g><text x="143" y="646" font-size="22" fill="#244b3e" font-weight="500" text-anchor="start">不安で、一歩を踏み出せない</text><text x="143" y="678" font-size="18" fill="#7d887c" font-weight="400" text-anchor="start">「何をされるか、よくわからない」</text><rect x="70" y="699" width="586" height="91" rx="8" fill="#dce6d5" stroke="none"/><text x="87" y="735" font-size="21" fill="#244b3e" font-weight="400" text-anchor="start">検査の流れを、まず確認してみませんか。</text><text x="87" y="769" font-size="21" fill="#244b3e" font-weight="400" text-anchor="start">当日の手順と、相談先をご案内します。</text><text x="70" y="820" font-size="17" fill="#244b3e" font-weight="400" text-anchor="start">知識の不足 → 手順を具体的に伝える</text><rect x="722" y="605" width="630" height="232" rx="0" fill="#faf9f3" stroke="#c5cec1"/><g transform="translate(771 661)" fill="none" stroke="#527364" stroke-width="3"><circle cx="0" cy="-22" r="15"/><path d="M-30 40V18Q-30-3 0-3Q30-3 30 18V40M-13 14V40M13 14V40"/></g><text x="817" y="646" font-size="22" fill="#244b3e" font-weight="500" text-anchor="start">必要だと思うが、先延ばし</text><text x="817" y="678" font-size="18" fill="#7d887c" font-weight="400" text-anchor="start">「受けたい。でも、予定が決まらない」</text><rect x="744" y="699" width="586" height="91" rx="8" fill="#efdfd1" stroke="none"/><text x="761" y="735" font-size="21" fill="#244b3e" font-weight="400" text-anchor="start">来月、都合のよい日はいつですか？</text><text x="761" y="769" font-size="21" fill="#244b3e" font-weight="400" text-anchor="start">候補日をひとつ選ぶことから始めましょう。</text><text x="744" y="820" font-size="17" fill="#244b3e" font-weight="400" text-anchor="start">意図を行動へ → 具体的な計画を立てる</text><path d="M48 864L1352 864" fill="none" stroke="#c5cec1" stroke-width="2" /><text x="48" y="898" font-size="17" fill="#b8795a" font-weight="400" text-anchor="start">社会への価値</text><text x="195" y="898" font-size="24" fill="#244b3e" font-weight="500" text-anchor="start">専門知を、企業・自治体が試せる施策とアプリへ。</text><text x="48" y="927" font-size="14" fill="#7d887c" font-weight="400" text-anchor="start">公開研究に基づく再構成。メッセージは仮想例であり、実際の生成結果や受診率改善の実証を示すものではありません。</text></g></svg>