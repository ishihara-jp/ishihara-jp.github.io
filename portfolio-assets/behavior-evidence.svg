<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc"><title id="title">行動科学とAIで、課題から根拠ある働きかけへ</title><desc id="desc">検診予約の先延ばしという課題から、AIが行動原理を推定し、研究知見に基づく介入技法を選び、具体的な予約日を促すメッセージを提案する説明用の例。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#527364"/></marker></defs><rect width="1400" height="560" fill="#f2f1e9"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#244b3e"><text x="45" y="57" font-size="32">行動科学 × AI</text><text x="1355" y="55" text-anchor="end" font-size="18">課題から、その人に届く働きかけへ</text>
<rect x="45" y="98" width="320" height="324" fill="#faf9f3" stroke="#c5cec1"/><text x="68" y="138" font-size="19" fill="#a67455">01 / 課題と特性</text><g transform="translate(103 211)" fill="none" stroke="#527364" stroke-width="3"><circle cy="-20" r="19"/><path d="M-36 46V19Q-36-2 0-2Q36-2 36 19V46M-16 18V46M16 18V46"/></g><text x="162" y="203" font-size="24">検診を受けたい。</text><text x="162" y="239" font-size="24">でも、また今度。</text><path d="M68 285H342" stroke="#c5cec1"/><text x="68" y="328" font-size="22">予約を先延ばしにする</text><text x="68" y="366" font-size="18" fill="#748271">業務の状況・個人の行動傾向</text>
<path d="M376 257H419" stroke="#527364" stroke-width="2" marker-end="url(#a)"/>
<rect x="435" y="98" width="490" height="324" fill="#e5ebdd" stroke="#c5cec1"/><text x="458" y="138" font-size="19" fill="#a67455">02 / エビデンスに基づくAI</text><g fill="none" stroke="#527364" stroke-width="2"><path d="M476 187L508 169L543 188L509 218L476 187L478 233L509 218L542 239L543 188M508 169L509 218"/><circle cx="476" cy="187" r="4"/><circle cx="508" cy="169" r="4"/><circle cx="543" cy="188" r="4"/><circle cx="509" cy="218" r="4"/><circle cx="478" cy="233" r="4"/><circle cx="542" cy="239" r="4"/></g><text x="568" y="195" font-size="24">行動原理を推定 → 介入を選択</text><text x="568" y="233" font-size="19">MoA × BCT</text><path d="M458 285H902" stroke="#c5cec1"/><g transform="translate(496 330)" fill="none" stroke="#527364" stroke-width="2"><path d="M0 0Q-17-9-34-4V38Q-17 33 0 43Q17 33 34 38V-4Q17-9 0 0V43M-26 8L-8 13M8 13L26 8"/></g><text x="551" y="330" font-size="21">論文・行動科学の知見を参照</text><text x="551" y="368" font-size="18">なぜ、その施策なのかも説明</text>
<path d="M938 257H981" stroke="#527364" stroke-width="2" marker-end="url(#a)"/>
<rect x="997" y="98" width="358" height="324" fill="#faf9f3" stroke="#c5cec1"/><text x="1020" y="138" font-size="19" fill="#a67455">03 / 個別メッセージを生成</text><rect x="1020" y="170" width="312" height="142" rx="8" fill="#efdfd1"/><text x="1039" y="209" font-size="23">来月、都合のよい日は？</text><text x="1039" y="249" font-size="23">候補日をひとつ</text><text x="1039" y="285" font-size="23">選んでみましょう。</text><text x="1020" y="367" font-size="21">意欲を、具体的な予定へ。</text>
<text x="45" y="474" font-size="19" fill="#748271">同じ仕組みを、さまざまな現場へ</text><g font-size="20"><text x="510" y="474">訓練</text><text x="750" y="474">習慣化</text><text x="1000" y="474">プロモーション</text></g><path d="M45 499H1355" stroke="#c5cec1"/><text x="45" y="536" font-size="15" fill="#748271">公開研究に基づく再構成。検診の施策・メッセージは説明用の仮想例です。</text></g></svg>